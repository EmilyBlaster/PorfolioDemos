<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Works Councils Banner</title>
        <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
        />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                font-family: 'Inter', sans-serif;
                background: transparent;
                overflow: hidden;
            }

            .banner-container {
                position: relative;
                width: 100%;
                height: 100%;
                min-height: 200px;
                background: hsl(220, 15%, 12%);
                overflow: hidden;
            }

            .banner-content {
                position: relative;
                z-index: 10;
                display: flex;
                align-items: center;
                height: 100%;
                padding: 5% 6%;
            }

            .text-content {
                max-width: 45%;
            }

            .objectives-container {
                position: absolute;
                right: 5%;
                top: 50%;
                transform: translateY(-50%);
                display: flex;
                flex-direction: column;
                gap: clamp(8px, 1.5vw, 16px);
                max-width: 40%;
            }

            .objective-tile {
                display: flex;
                align-items: center;
                gap: clamp(10px, 1.2vw, 16px);
                background: rgba(255, 255, 255, 0.08);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: clamp(8px, 1vw, 12px);
                padding: clamp(10px, 1.2vw, 16px) clamp(14px, 1.5vw, 20px);
                opacity: 0;
                transform: translateX(30px);
                animation: slideIn 0.5s ease-out forwards;
            }

            .objective-tile:nth-child(1) { animation-delay: 0.1s; }
            .objective-tile:nth-child(2) { animation-delay: 0.2s; }
            .objective-tile:nth-child(3) { animation-delay: 0.3s; }
            .objective-tile:nth-child(4) { animation-delay: 0.4s; }

            @keyframes slideIn {
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }

            .objective-icon {
                flex-shrink: 0;
                width: clamp(24px, 2.5vw, 36px);
                height: clamp(24px, 2.5vw, 36px);
                background: linear-gradient(135deg, hsl(270, 50%, 60%), hsl(270, 50%, 50%));
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .objective-icon svg {
                width: 60%;
                height: 60%;
                stroke: white;
                stroke-width: 3;
                fill: none;
            }

            .objective-text {
                font-size: clamp(10px, 1vw, 15px);
                color: rgba(255, 255, 255, 0.9);
                font-weight: 400;
                line-height: 1.4;
            }

            h1 {
                font-size: clamp(24px, 5vw, 96px);
                font-weight: 800;
                color: white;
                line-height: 1.1;
                margin-bottom: clamp(12px, 2vw, 24px);
            }

            .gradient-text {
                background: linear-gradient(to right, hsl(270, 50%, 60%), hsl(270, 50%, 70%), hsl(16, 100%, 60%));
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .subtitle-container {
                display: flex;
                align-items: center;
                gap: 16px;
            }

            .accent-line {
                height: clamp(2px, 0.4vw, 4px);
                width: clamp(48px, 5vw, 96px);
                background: linear-gradient(to right, hsl(270, 50%, 60%), hsl(16, 100%, 60%));
                border-radius: 9999px;
            }

            .subtitle {
                font-size: clamp(12px, 1.25vw, 24px);
                color: rgba(255, 255, 255, 0.8);
                font-weight: 300;
            }

            .bottom-accent {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 8px;
                background: linear-gradient(to right, hsl(270, 50%, 60%), hsl(16, 100%, 60%), hsl(270, 50%, 60%));
            }

            .banner-svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div class="banner-container">
            <!-- Background with flowing swirl -->
            <svg
                class="banner-svg"
                viewBox="0 0 1920 700"
                xmlns="http://www.w3.org/2000/svg"
                preserveAspectRatio="xMidYMid slice"
            >
                <defs>
                    <radialGradient
                        id="purpleGlow"
                        cx="80%"
                        cy="15%"
                        r="45%"
                    >
                        <stop
                            offset="0%"
                            stop-color="hsl(270, 45%, 30%)"
                            stop-opacity="0.08"
                        />
                        <stop
                            offset="100%"
                            stop-color="transparent"
                            stop-opacity="0"
                        />
                    </radialGradient>
                    <radialGradient
                        id="orangeGlow"
                        cx="95%"
                        cy="90%"
                        r="40%"
                    >
                        <stop
                            offset="0%"
                            stop-color="hsl(20, 65%, 40%)"
                            stop-opacity="0.08"
                        />
                        <stop
                            offset="100%"
                            stop-color="transparent"
                            stop-opacity="0"
                        />
                    </radialGradient>
                </defs>

                <rect
                    x="0"
                    y="0"
                    width="1920"
                    height="700"
                    fill="url(#purpleGlow)"
                />
                <rect
                    x="0"
                    y="0"
                    width="1920"
                    height="700"
                    fill="url(#orangeGlow)"
                />

                <!-- Flowing swirl dots -->
                <g id="swirl-container"></g>
            </svg>

            <!-- Content -->
            <div class="banner-content">
                <div class="text-content">
                    <h1>
                        What are<br />
                        <span class="gradient-text">Works Councils?</span>
                    </h1>
                    <div class="subtitle-container">
                        <div class="accent-line"></div>
                        <p class="subtitle">Why do they matter?</p>
                    </div>
                </div>

                <div class="objectives-container">
                    <div class="objective-tile">
                        <div class="objective-icon">
                            <svg viewBox="0 0 24 24">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <span class="objective-text"
                            >Define what a Works Council is.</span
                        >
                    </div>
                    <div class="objective-tile">
                        <div class="objective-icon">
                            <svg viewBox="0 0 24 24">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <span class="objective-text"
                            >Explain how Works Councils differ from trade
                            unions.</span
                        >
                    </div>
                    <div class="objective-tile">
                        <div class="objective-icon">
                            <svg viewBox="0 0 24 24">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <span class="objective-text"
                            >Recall the legal mandate and formation of Works
                            Councils.</span
                        >
                    </div>
                    <div class="objective-tile">
                        <div class="objective-icon">
                            <svg viewBox="0 0 24 24">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <span class="objective-text"
                            >Identify the core principles guiding employer-Works
                            Council relations.</span
                        >
                    </div>
                </div>
            </div>

            <!-- Bottom accent line -->
            <div class="bottom-accent"></div>
        </div>

        <script>
            let seed = 1;
            function seededRandom() {
                seed++;
                const x = Math.sin(seed) * 10000;
                return x - Math.floor(x);
            }

            function bezierPoint(t, p0, p1, p2, p3) {
                const mt = 1 - t;
                return mt*mt*mt*p0 + 3*mt*mt*t*p1 + 3*mt*t*t*p2 + t*t*t*p3;
            }

            const swirlContainer = document.getElementById('swirl-container');

            const curve = {
                x: { p0: 1920, p1: 1100, p2: 1100, p3: 1920 },
                y: { p0: -100, p1: 150, p2: 550, p3: 800 }
            };

            const numLayers = 25;
            const dotsPerLayer = 120;

            for (let layer = 0; layer < numLayers; layer++) {
                const layerOffset = (layer - numLayers / 2) * 18;

                for (let i = 0; i < dotsPerLayer; i++) {
                    const t = i / dotsPerLayer;

                    let x = bezierPoint(t, curve.x.p0, curve.x.p1, curve.x.p2, curve.x.p3);
                    let y = bezierPoint(t, curve.y.p0, curve.y.p1, curve.y.p2, curve.y.p3);

                    const tDelta = 0.01;
                    const x2 = bezierPoint(t + tDelta, curve.x.p0, curve.x.p1, curve.x.p2, curve.x.p3);
                    const y2 = bezierPoint(t + tDelta, curve.y.p0, curve.y.p1, curve.y.p2, curve.y.p3);
                    const dx = x2 - x;
                    const dy = y2 - y;
                    const len = Math.sqrt(dx*dx + dy*dy);
                    const nx = -dy / len;
                    const ny = dx / len;

                    x += nx * layerOffset;
                    y += ny * layerOffset;

                    x += (seededRandom() - 0.5) * 25;
                    y += (seededRandom() - 0.5) * 20;

                    if (x < 850 || x > 1950 || y < -20 || y > 720) continue;

                    const size = 1.2 + seededRandom() * 2.8;

                    const colorY = y / 700;
                    let hue, sat, light;

                    if (colorY < 0.25) {
                        hue = 265 + seededRandom() * 15;
                        sat = 60 + seededRandom() * 20;
                        light = 35 + seededRandom() * 20;
                    } else if (colorY < 0.45) {
                        hue = 280 + seededRandom() * 25;
                        sat = 55 + seededRandom() * 25;
                        light = 40 + seededRandom() * 20;
                    } else if (colorY < 0.65) {
                        hue = 320 + seededRandom() * 30;
                        sat = 60 + seededRandom() * 25;
                        light = 45 + seededRandom() * 18;
                    } else {
                        hue = 15 + seededRandom() * 25;
                        sat = 70 + seededRandom() * 25;
                        light = 48 + seededRandom() * 18;
                    }

                    const edgeDist = Math.abs(layer - numLayers / 2) / (numLayers / 2);
                    const edgeOpacity = 1 - edgeDist * 0.6;
                    const opacity = (0.45 + seededRandom() * 0.45) * edgeOpacity;

                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', x);
                    circle.setAttribute('cy', y);
                    circle.setAttribute('r', size);
                    circle.setAttribute('fill', `hsl(${hue}, ${sat}%, ${light}%)`);
                    circle.setAttribute('opacity', opacity);
                    swirlContainer.appendChild(circle);
                }
            }

            for (let i = 0; i < 2500; i++) {
                const t = seededRandom();

                const cx = bezierPoint(t, curve.x.p0, curve.x.p1, curve.x.p2, curve.x.p3);
                const cy = bezierPoint(t, curve.y.p0, curve.y.p1, curve.y.p2, curve.y.p3);

                const angle = seededRandom() * Math.PI * 2;
                const dist = seededRandom() * 180;
                const x = cx + Math.cos(angle) * dist + (seededRandom() - 0.5) * 50;
                const y = cy + Math.sin(angle) * dist * 0.7 + (seededRandom() - 0.5) * 40;

                if (x < 880 || x > 1920 || y < 0 || y > 700) continue;

                const size = 0.8 + seededRandom() * 2;

                const colorY = y / 700;
                let hue, sat, light;

                if (colorY < 0.3) {
                    hue = 260 + seededRandom() * 20;
                    sat = 55 + seededRandom() * 25;
                    light = 32 + seededRandom() * 22;
                } else if (colorY < 0.55) {
                    hue = 295 + seededRandom() * 35;
                    sat = 50 + seededRandom() * 30;
                    light = 40 + seededRandom() * 20;
                } else {
                    hue = 10 + seededRandom() * 30;
                    sat = 65 + seededRandom() * 30;
                    light = 45 + seededRandom() * 20;
                }

                const opacity = 0.25 + seededRandom() * 0.5;

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', x);
                circle.setAttribute('cy', y);
                circle.setAttribute('r', size);
                circle.setAttribute('fill', `hsl(${hue}, ${sat}%, ${light}%)`);
                circle.setAttribute('opacity', opacity);
                swirlContainer.appendChild(circle);
            }
        </script>
    </body>
</html>
