<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Works Council Training Module</title>
        <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { overflow: hidden !important; }
            body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; color: #374151; line-height: 1.6; padding-top: 80px; /* adjust to taste */ }
            #root { overflow: hidden !important; }
            :root {
              --card: #ffffff;
              --border: #e5e7eb;
              --muted: #f3f4f6;
              --muted-fg: #6b7280;
              --accent: #f97316;
              --accent-light: #fff7ed;
              --primary: #8b5cf6;
              --primary-light: #f5f3ff;
              --foreground: #111827;
              --destructive: #ef4444;
            }
            .module-container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; overflow: hidden !important; }
            .progress-bar { display: flex; gap: 6px; max-width: 280px; margin-bottom: 1.25rem; }
            .progress-segment { height: 4px; flex: 1; border-radius: 9999px; transition: background-color 0.3s; }
            .progress-segment.completed { background: var(--primary); }
            .progress-segment.current { background: var(--accent); }
            .progress-segment.upcoming { background: #d1d5db; }
            .step-card { background: var(--card); border-radius: 1rem; overflow: visible; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); }
            .grid-layout { display: grid; grid-template-columns: 1fr; min-height: 400px; }
            @media (min-width: 1024px) { .grid-layout { grid-template-columns: 1fr 1.2fr; } }
            .image-column { position: relative; min-height: 200px; background: var(--muted); overflow: hidden !important; }
            .image-column img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
            .image-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(249,115,22,0.2)); }
            .content-column { padding: 2rem 2.5rem; display: flex; flex-direction: column; justify-content: center; }
            .tag { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); font-weight: 600; margin-bottom: 0.5rem; }
            .concept-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
            .concept-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
            .concept-icon svg { width: 18px; height: 18px; color: white; }
            .concept-title { font-size: 1.25rem; font-weight: 700; color: var(--foreground); }
            .concept-subtitle { font-size: 0.75rem; color: var(--muted-fg); }
            .body-text { font-size: 15px; color: var(--muted-fg); margin-bottom: 0.75rem; }
            .body-text strong { color: var(--foreground); }
            .lead-text { font-size: 1.25rem; color: var(--foreground); font-weight: 300; }
            .lead-text strong { font-weight: 600; }
            .highlight-box { background: var(--accent-light); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 0.75rem 1rem; margin: 1rem 0; }
            .highlight-box p { color: #ea580c; font-size: 14px; font-weight: 500; }
            .intro-badge { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--primary-light); color: var(--primary); padding: 0.375rem 0.75rem; border-radius: 9999px; font-size: 12px; font-weight: 600; margin-bottom: 1rem; }
            .intro-badge svg { width: 14px; height: 14px; }
            .nav-buttons { display: flex; gap: 0.75rem; margin-top: 1.5rem; justify-content: flex-end; }
            .btn { padding: 0.625rem 1.25rem; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; }
            .btn-secondary { background: var(--muted); color: var(--muted-fg); border: 1px solid var(--border); }
            .btn-secondary:hover { background: #e5e7eb; }
            .btn-primary { background: linear-gradient(135deg, var(--primary), #7c3aed); color: white; }
            .btn-primary:hover { opacity: 0.9; }
            .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
            .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
            @media (max-width: 768px) { .comparison-grid { grid-template-columns: 1fr; } }
            .comparison-card { padding: 1.25rem; border-radius: 12px; }
            .comparison-card.council { background: var(--primary-light); border: 2px solid var(--primary); }
            .comparison-card.union { background: var(--muted); border: 2px solid transparent; }
            .comparison-card h4 { font-size: 14px; font-weight: 700; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
            .comparison-card.council h4 { color: var(--primary); }
            .comparison-card.union h4 { color: var(--muted-fg); }
            .comparison-card ul { list-style: none; font-size: 13px; color: var(--muted-fg); }
            .comparison-card li { margin-bottom: 0.375rem; padding-left: 1rem; position: relative; }
            .comparison-card li::before { content: "•"; position: absolute; left: 0; }
            .comparison-card li strong { color: var(--foreground); }
            .stat-box { display: flex; align-items: center; gap: 1rem; background: var(--muted); border-radius: 12px; padding: 0.875rem 1.25rem; margin: 1rem 0; }
            .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--accent); line-height: 1; }
            .stat-label { font-size: 14px; color: var(--muted-fg); }
            .country-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
            .country-tag { background: #f9fafb; padding: 0.375rem 0.625rem; border-radius: 6px; font-size: 12px; color: var(--muted-fg); border: 1px solid var(--border); }
            .scenario-box { background: var(--muted); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
            .scenario-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted-fg); margin-bottom: 0.375rem; }
            .scenario-text { font-size: 14px; color: var(--foreground); }
            .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.625rem; }
            @media (max-width: 768px) { .choices-grid { grid-template-columns: 1fr; } }
            .choice-btn { background: #f9fafb; border: 2px solid var(--border); border-radius: 12px; padding: 0.875rem 1rem; text-align: left; font-size: 15px; color: var(--muted-fg); cursor: pointer; transition: all 0.2s; display: flex; align-items: flex-start; gap: 0.625rem; }
            .choice-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
            .choice-btn:disabled { opacity: 0.6; cursor: not-allowed; }
            .choice-btn.selected { border-color: var(--primary); background: var(--primary-light); opacity: 1; }
            .choice-btn.correct { border-color: var(--primary); background: #ede9fe; opacity: 1; }
            .choice-btn.incorrect { border-color: var(--destructive); background: #fef2f2; color: #b91c1c; }
            .choice-letter { width: 24px; height: 24px; background: #e5e7eb; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; color: var(--muted-fg); }
            .choice-btn.selected .choice-letter, .choice-btn.correct .choice-letter { background: var(--primary); color: white; }
            .choice-btn.incorrect .choice-letter { background: var(--destructive); color: white; }
            .feedback { grid-column: 1 / -1; padding: 0.875rem; border-radius: 8px; font-size: 14px; margin-top: 0.5rem; }
            .feedback.correct { background: #ede9fe; border: 1px solid var(--primary); color: var(--foreground); }
            .feedback.incorrect { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; }
            .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; }
            @media (max-width: 768px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
            .summary-card { background: var(--muted); border-radius: 12px; padding: 0.875rem; text-align: center; }
            .summary-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.5rem; }
            .summary-icon svg { width: 16px; height: 16px; color: white; }
            .summary-card h4 { font-size: 12px; font-weight: 700; color: var(--foreground); margin-bottom: 0.25rem; }
            .summary-card p { font-size: 11px; color: var(--muted-fg); }
            @keyframes crossfade { from { opacity: 0; } to { opacity: 1; } }
            .animate-fade-in { animation: crossfade 0.3s ease-out; }
            .step-wrapper { position: relative; overflow: visible; }
            .step-card { animation: crossfade 0.4s ease-in-out; }
        </style>
    </head>
    <body>
        <div id="root"></div>

        <script type="text/babel">
            const { useState } = React;

            const Icons = {
              BookOpen: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
              ),
              Handshake: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/>
                </svg>
              ),
              Users: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
              ),
              Flag: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>
                </svg>
              ),
              Scale: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
                </svg>
              ),
            };

            const ProgressBar = ({ currentStep, totalSteps }) => (
              <div className="progress-bar">
                {Array.from({ length: totalSteps }, (_, i) => i + 1).map((step) => (
                  <div
                    key={step}
                    className={`progress-segment ${step < currentStep ? 'completed' : step === currentStep ? 'current' : 'upcoming'}`}
                  />
                ))}
              </div>
            );

            const NavButtons = ({ onPrev, onNext, prevLabel = "← Back", nextLabel = "Continue →", showPrev = true, nextDisabled = false }) => (
              <div className="nav-buttons">
                {showPrev && <button className="btn btn-secondary" onClick={onPrev}>{prevLabel}</button>}
                <button className="btn btn-primary" onClick={onNext} disabled={nextDisabled}>{nextLabel}</button>
              </div>
            );

            const StepHook = ({ onNext }) => (
              <div className="step-card">
                <div className="grid-layout">
                  <div className="image-column">
                    <img src="https://i.ibb.co/3yDXBrsG/pexels-shvetsa-4226256-1.jpg" alt="Team collaboration" />
                    <div className="image-overlay"></div>
                  </div>
                  <div className="content-column">
                    <div className="intro-badge">
                      <Icons.BookOpen />
                      Introduction to Key Terms and Concepts
                    </div>
                    <p className="lead-text">
                      You're a manager at <strong>your company</strong>, and the team is expanding into <strong>Germany</strong>.
                      <br /><br />
                      A team member asks: <strong>"When are we setting up the Works Council?"</strong>
                      <br /><br />
                      Let's make sure you understand what that means.
                    </p>
                    <NavButtons onNext={onNext} nextLabel="Let's learn →" showPrev={false} />
                  </div>
                </div>
              </div>
            );

            const StepCorePrinciple = ({ onPrev, onNext }) => (
              <div className="step-card">
                <div className="grid-layout">
                  <div className="image-column">
                    <img src="https://i.ibb.co/xtmYw6d3/pexels-ketut-subiyanto-4963437.jpg" alt="Collaboration" />
                    <div className="image-overlay"></div>
                  </div>
                  <div className="content-column">
                    <span className="tag">The foundation</span>
                    <div className="concept-header">
                      <div className="concept-icon"><Icons.Handshake /></div>
                      <div>
                        <div className="concept-title">Core Principle</div>
                        <div className="concept-subtitle">Good faith collaboration</div>
                      </div>
                    </div>
                    <p className="body-text">
                      In many European countries, there's a fundamental belief that <strong>employers and employees should work together in good faith</strong> on workplace decisions.
                    </p>
                    <p className="body-text">This isn't just a nice idea—it's often written into law.</p>
                    <div className="highlight-box">
                      <p>This principle is the foundation for everything that follows.</p>
                    </div>
                    <NavButtons onPrev={onPrev} onNext={onNext} nextLabel="What's a Works Council? →" />
                  </div>
                </div>
              </div>
            );

            const StepWorksCouncil = ({ onPrev, onNext }) => (
              <div className="step-card">
                <div className="grid-layout">
                  <div className="image-column">
                    <img src="https://i.ibb.co/N6RtkDfB/pexels-shvetsa-4226140.jpg" alt="Team meeting" style={{objectPosition: "10% 30%"}} />
                    <div className="image-overlay"></div>
                  </div>
                  <div className="content-column">
                    <span className="tag">The "what"</span>
                    <div className="concept-header">
                      <div className="concept-icon"><Icons.Users /></div>
                      <div>
                        <div className="concept-title">Works Council</div>
                        <div className="concept-subtitle">Employee representation at the company level</div>
                      </div>
                    </div>
                    <p className="body-text">
                      A Works Council is a group of <strong>elected team member representatives</strong> who provide input on workplace decisions.
                    </p>
                    <p className="body-text">They're elected by employees, but they work <em>with</em> the employer—not against them.</p>
                    <div className="highlight-box">
                      <p>Think: working conditions, policies, restructuring, and HR decisions.</p>
                    </div>
                    <NavButtons onPrev={onPrev} onNext={onNext} nextLabel="How's it different from a union? →" />
                  </div>
                </div>
              </div>
            );

            const StepComparison = ({ onPrev, onNext }) => (
              <div className="step-card">
                <div className="content-column" style={{ padding: '2rem' }}>
                  <span className="tag">The difference</span>
                  <h2 style={{ fontSize: '1.5rem', fontWeight: 700, marginBottom: '1.5rem', color: 'var(--foreground)' }}>
                    Works Council vs. Trade Union
                  </h2>
                  <div className="comparison-grid">
                    <div className="comparison-card council">
                      <h4><Icons.Users /> Works Council</h4>
                      <ul>
                        <li>Internal to one company</li>
                        <li>Elected by employees</li>
                        <li>Collaborates with employer</li>
                        <li>Cannot strike</li>
                        <li>Focuses on company-specific issues</li>
                      </ul>
                    </div>
                    <div className="comparison-card union">
                      <h4><Icons.Flag /> Trade Union</h4>
                      <ul>
                        <li>Industry or sector-wide</li>
                        <li>Voluntary membership</li>
                        <li>Can negotiate and strike</li>
                        <li>External organization</li>
                        <li>Focuses on wages and benefits</li>
                      </ul>
                    </div>
                  </div>
                  <NavButtons onPrev={onPrev} onNext={onNext} nextLabel="When is it required? →" />
                </div>
              </div>
            );

            const StepLegalMandate = ({ onPrev, onNext }) => (
              <div className="step-card">
                <div className="grid-layout">
                  <div className="image-column">
                    <img src="https://i.ibb.co/6cVF0sg1/pexels-diva-plavalaguna-6147014.jpg" alt="Legal documents" style={{objectPosition: "center 25%"}} />
                    <div className="image-overlay"></div>
                  </div>
                  <div className="content-column">
                    <span className="tag">The legal requirement</span>
                    <div className="concept-header">
                      <div className="concept-icon"><Icons.Scale /></div>
                      <div>
                        <div className="concept-title">Legal Mandate</div>
                        <div className="concept-subtitle">When a Works Council becomes required</div>
                      </div>
                    </div>
                    <div className="stat-box">
                      <div className="stat-number">5+</div>
                      <div className="stat-label">employees triggers the requirement in Germany</div>
                    </div>
                    <div className="country-tags">
                      <span className="country-tag">🇩🇪 Germany: 5</span>
                      <span className="country-tag">🇳🇱 Netherlands: 50</span>
                      <span className="country-tag">🇫🇷 France: 11</span>
                    </div>
                    <NavButtons onPrev={onPrev} onNext={onNext} nextLabel="Test your knowledge →" />
                  </div>
                </div>
              </div>
            );

            const StepQuiz = ({ onPrev, onNext }) => {
              const [selected, setSelected] = useState(null);
              const [answered, setAnswered] = useState(false);

              const choices = [
                { id: "a", text: '"We need at least 50 employees first."' },
                { id: "b", text: '"That\'s the same as a union—contact an external org."' },
                { id: "c", text: '"If employees want one, we must support the process."' },
                { id: "d", text: '"That\'s not something we do here."' },
              ];

              const feedbackMessages = {
                a: "50 employees is the Netherlands threshold. Germany's is only 5.",
                b: "Works Councils are internal and elected by employees—different from unions.",
                d: "Companies can't opt out. If employees request one and you meet the threshold, you must support it.",
              };

              const handleSelect = (id) => {
                if (answered) return;
                setSelected(id);
                setAnswered(true);
              };

              const isCorrect = selected === "c";

              return (
                <div className="step-card">
                  <div className="content-column" style={{ padding: '2rem' }}>
                    <span className="tag">Check your understanding</span>
                    <div className="scenario-box">
                      <div className="scenario-label">Scenario</div>
                      <p className="scenario-text">
                        Your German office has 12 employees. A team member asks about forming a Works Council. What's the most accurate response?
                      </p>
                    </div>
                    <div className="choices-grid">
                      {choices.map((choice) => (
                        <button
                          key={choice.id}
                          onClick={() => handleSelect(choice.id)}
                          disabled={answered}
                          className={`choice-btn ${selected === choice.id ? 'selected' : ''} ${answered && choice.id === 'c' ? 'correct' : ''} ${answered && selected === choice.id && choice.id !== 'c' ? 'incorrect' : ''}`}
                        >
                          <span className="choice-letter">{choice.id.toUpperCase()}</span>
                          <span>{choice.text}</span>
                        </button>
                      ))}
                      {answered && (
                        <div className={`feedback ${isCorrect ? 'correct' : 'incorrect'} animate-fade-in`}>
                          {isCorrect ? (
                            <><strong>Correct!</strong> Germany's threshold is 5 employees. At 12, employees can request a Works Council and you must support the process.</>
                          ) : (
                            <><strong>Not quite.</strong> {feedbackMessages[selected]}</>
                          )}
                        </div>
                      )}
                    </div>
                    <NavButtons onPrev={onPrev} onNext={onNext} nextLabel="Continue →" nextDisabled={!answered} />
                  </div>
                </div>
              );
            };

            const StepSummary = ({ onPrev, onRestart }) => {
              const summaryCards = [
                { icon: Icons.Handshake, title: "Core Principle", description: "Good faith collaboration between employers and employees" },
                { icon: Icons.Users, title: "Works Council", description: "Elected employee reps at a specific company" },
                { icon: Icons.Flag, title: "Trade Union", description: "Industry-wide orgs that can negotiate and strike" },
                { icon: Icons.Scale, title: "Legal Mandate", description: "Required once company reaches specific headcount" },
              ];

              return (
                <div className="step-card">
                  <div className="content-column" style={{ padding: '2rem' }}>
                    <span className="tag">You've got it! 🎉</span>
                    <div className="summary-grid">
                      {summaryCards.map((card) => (
                        <div key={card.title} className="summary-card">
                          <div className="summary-icon"><card.icon /></div>
                          <h4>{card.title}</h4>
                          <p>{card.description}</p>
                        </div>
                      ))}
                    </div>
                    <div className="highlight-box" style={{ marginTop: '1rem' }}>
                      <p>As a manager, your role is to understand these rights and collaborate in good faith when employees exercise them.</p>
                    </div>
                    <NavButtons onPrev={onPrev} onNext={onRestart} prevLabel="← Review" nextLabel="Start over ↺" />
                  </div>
                </div>
              );
            };

            const WorksCouncilModule = () => {
              const [currentStep, setCurrentStep] = useState(1);
              const TOTAL_STEPS = 7;

              const nextStep = () => currentStep < TOTAL_STEPS && setCurrentStep(prev => prev + 1);
              const prevStep = () => currentStep > 1 && setCurrentStep(prev => prev - 1);
              const restart = () => setCurrentStep(1);

              const renderStep = () => {
                switch (currentStep) {
                  case 1: return <StepHook onNext={nextStep} />;
                  case 2: return <StepCorePrinciple onPrev={prevStep} onNext={nextStep} />;
                  case 3: return <StepWorksCouncil onPrev={prevStep} onNext={nextStep} />;
                  case 4: return <StepComparison onPrev={prevStep} onNext={nextStep} />;
                  case 5: return <StepLegalMandate onPrev={prevStep} onNext={nextStep} />;
                  case 6: return <StepQuiz onPrev={prevStep} onNext={nextStep} />;
                  case 7: return <StepSummary onPrev={prevStep} onRestart={restart} />;
                  default: return null;
                }
              };

              return (
                <div className="module-container">
                  <ProgressBar currentStep={currentStep} totalSteps={TOTAL_STEPS} />
                  <div className="step-wrapper" key={currentStep}>
                    {renderStep()}
                  </div>
                </div>
              );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<WorksCouncilModule />);
        </script>
    </body>
</html>
